[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "gitpython>=3.1.40",
    "requests>=2.31.0",
]

[project.scripts]
doc-agent = "doc_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_agent"]